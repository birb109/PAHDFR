<template id="hero">
  <div class="hero container-fluid px-0 py-3 border-bottom">
    <div class="eyebrow">PAHDFR · Research prototype</div>
    <h1>Historical Digital Footprint Reconstruction</h1>
    <p>
      Algorithm 1 discovers and stores archived artifacts. Algorithm 2 reads those stored
      artifacts, correlates annotated entity observations, and writes its evidence to the

</template>

  <div class="collection-success d-inline-block bg-white border border-danger border-start border-4 rounded p-3 mb-3">{{ message }}</div>
</template>

      This area is reserved for the separate Algorithm 3 task. No Algorithm 3 logic is
      implemented here.
    </p>
